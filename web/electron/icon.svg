<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a3040"/>
      <stop offset="0.55" stop-color="#161a23"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#rim)"/>
    <rect x="102" y="102" width="820" height="820" rx="183" ry="183"
          fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <!-- one trunk branching into three agents -->
  <g stroke="#5b8cff" stroke-width="30" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M356 512 H452"/>
    <path d="M452 512 C 524 512, 524 360, 596 360"/>
    <path d="M452 512 H596"/>
    <path d="M452 512 C 524 512, 524 664, 596 664"/>
  </g>
  <circle cx="356" cy="512" r="52" fill="#e6e9f0"/>
  <circle cx="644" cy="360" r="44" fill="#3fb950"/>
  <circle cx="644" cy="512" r="44" fill="#5b8cff"/>
  <circle cx="644" cy="664" r="44" fill="#d29922"/>
</svg>